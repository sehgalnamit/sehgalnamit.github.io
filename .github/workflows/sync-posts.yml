name: Sync articles from Hashnode

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests markdownify

      - name: Run sync script
        run: python scripts/sync_posts.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts
          if ! git diff --cached --quiet; then
            git commit -m "Backup: auto-sync new articles from articles.namitsehgal.com"
            git push
          else
            echo "No new articles to sync."
          fi
